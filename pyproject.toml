[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-graphmedic"
version = "0.1.0"
description = "Approval-gated metadata repair agent for DataHub's official MCP server"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.116.1",
  "mcp>=1.20,<3",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
datahub = [
  "acryl-datahub==1.7.0",
  "mcp-server-datahub==0.6.0",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
graphmedic = "graphmedic.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphmedic = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
